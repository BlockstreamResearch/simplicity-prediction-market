name: prediction-demo

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: prediction-demo
      POSTGRES_PASSWORD: prediction-demo
      POSTGRES_DB: prediction-demo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "prediction-demo", "-d", "prediction-demo"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    image: us-central1-docker.pkg.dev/blockstream/gh-prediction-market/server:${SERVER_IMAGE_TAG:?set SERVER_IMAGE_TAG to a published server tag, or local for a local build}
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        PRICE_ORACLE_REF: ${PRICE_ORACLE_REF:-}
    restart: unless-stopped
    environment:
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
      PREDICTION_ADMIN_LOGIN: ${PREDICTION_ADMIN_LOGIN:?set PREDICTION_ADMIN_LOGIN for the Market desk admin}
      PREDICTION_ADMIN_PASSWORD: ${PREDICTION_ADMIN_PASSWORD:?set PREDICTION_ADMIN_PASSWORD (at least 16 characters)}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${PREDICTION_CONFIG:-./docker/server.toml}:/etc/prediction-demo/config.toml:ro
      - escrow-data:/var/lib/prediction-demo
    ports:
      - "127.0.0.1:${API_PORT:-3100}:3100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3100/api/predictions"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    image: us-central1-docker.pkg.dev/blockstream/gh-prediction-market/web:${WEB_IMAGE_TAG:?set WEB_IMAGE_TAG to a published web tag, or local for a local build}
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        PRICE_ORACLE_REF: ${PRICE_ORACLE_REF:-}
        VITE_SERVER_API: ${VITE_SERVER_API:-}
    environment:
      PREDICTION_API_UPSTREAM: http://server:3100
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  escrow-data: